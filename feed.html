<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VNYone | Community Feed</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --accent: #ff85a2; --bg: #0b101a; --card-bg: rgba(30, 41, 59, 0.5); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; overflow-x: hidden; }

        /* --- HEADER --- */
        .feed-header { 
            position: sticky; top: 0; padding: 15px; 
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: space-between;
            z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .feed-header b { font-size: 22px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }

        /* --- POST CARD --- */
        #posts-container { padding: 12px; display: flex; flex-direction: column; gap: 20px; margin-bottom: 80px; }
        .post-card { 
            background: var(--card-bg); border-radius: 20px; 
            overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .post-user { padding: 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .post-user i { font-size: 20px; color: var(--accent); }
        .post-user b { font-size: 15px; color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.2); }

        .post-img { width: 100%; display: block; object-fit: cover; max-height: 400px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* --- ACTIONS --- */
        .post-actions { padding: 12px; display: flex; gap: 20px; font-size: 22px; }
        .btn-like { color: #555; transition: 0.3s; cursor: pointer; }
        .btn-like.liked { color: var(--accent); text-shadow: 0 0 10px var(--accent); transform: scale(1.1); }
        .fa-comment { color: #888; }

        .post-content { padding: 0 15px 10px 15px; }
        .post-content .caption { font-size: 14px; color: #cbd5e1; margin-bottom: 8px; }
        .post-content .caption b { color: var(--accent); margin-right: 5px; }

        /* --- COMMENT SYSTEM --- */
        .comment-box { border-top: 1px solid rgba(255,255,255,0.03); padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        .comment-box input { 
            flex: 1; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; padding: 8px 15px; color: white; outline: none; font-size: 13px;
        }
        .comment-box i { color: var(--accent); font-size: 18px; }

        /* --- BOTTOM NAV --- */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: rgba(15, 23, 42, 0.98);
            display: flex; justify-content: space-around; padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000;
        }
        .bottom-nav i { font-size: 22px; color: rgba(255,255,255,0.3); }
        .nav-active { color: var(--accent) !important; text-shadow: 0 0 15px var(--accent); }
    </style>
</head>
<body>

    <div class="feed-header">
        <b>VNYone Feed</b>
        <i class="fa fa-paper-plane" onclick="window.location='home.html'" style="color:var(--accent)"></i>
    </div>

    <div id="posts-container">
        </div>

    <div class="bottom-nav">
        <i class="fa fa-home nav-active"></i>
        <i class="fa fa-plus-square" onclick="window.location='post.html'"></i>
        <i class="fa fa-comment-dots" onclick="window.location='home.html'"></i>
    </div>

    <script src="firebase.js"></script>
    <script>
        const db = firebase.firestore();
        const myName = localStorage.getItem("userName") || "User";

        // Load Posts Real-time
        db.collection("posts").orderBy("timestamp", "desc").onSnapshot(snap => {
            const container = document.getElementById("posts-container");
            container.innerHTML = "";
            
            snap.forEach(doc => {
                let p = doc.data();
                let postID = doc.id;
                
                let card = `
                    <div class="post-card">
                        <div class="post-user">
                            <i class="fa-solid fa-circle-user"></i>
                            <b>${p.name || "VNYone User"}</b>
                        </div>
                        <img src="${p.image}" class="post-img" ondblclick="handleLike('${postID}')">
                        <div class="post-actions">
                            <i id="like-${postID}" class="fa-solid fa-heart btn-like" onclick="handleLike('${postID}')"></i>
                            <i class="fa-regular fa-comment"></i>
                        </div>
                        <div class="post-content">
                            <div class="caption"><b>${p.name || "User"}</b> ${p.caption || ""}</div>
                        </div>
                        <div class="comment-box">
                            <input type="text" id="input-${postID}" placeholder="Add a comment...">
                            <i class="fa fa-paper-plane" onclick="sendComment('${postID}')"></i>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        });

        // Simple Like Toggle (Visual Only for now)
        function handleLike(id) {
            const heart = document.getElementById('like-' + id);
            heart.classList.toggle('liked');
        }

        // Send Comment (Coming soon to Firestore)
        function sendComment(id) {
            const inp = document.getElementById('input-' + id);
            if(!inp.value.trim()) return;
            alert("Comment Posted: " + inp.value); // Isko Firestore se kal connect karenge
            inp.value = "";
        }
    </script>
</body>
</html>
